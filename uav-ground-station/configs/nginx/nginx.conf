#
# TLS-terminating reverse proxy for the ground-station dashboard
# (docker-compose-nginx.yml). One HTTPS origin serves the UI, the /api/*
# endpoints (including the SSE streams) and the mediamtx WHEP viewer pages
# (/mediamtx/...), so the browser never needs plain-HTTP or mixed content.
# WebRTC media itself still flows browser <-> mediamtx over ICE (8189).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS; upstreams are resolved per request through
    # variables so nginx starts even before the backend containers exist.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;

        client_max_body_size 50M;

        # mediamtx WHEP viewer page + signalling, e.g. /mediamtx/<path>/ and
        # /mediamtx/<path>/whep. The prefix is stripped before proxying.
        location /mediamtx/ {
            set $mediamtx http://mediamtx:8889;
            rewrite ^/mediamtx/(.*)$ /$1 break;
            proxy_pass         $mediamtx;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            # WHEP answers carry an absolute session URL (Location: /<path>/whep/<id>)
            # that the browser later PATCHes (ICE) and DELETEs (teardown).
            proxy_redirect     ~^/(.+)$ /mediamtx/$1;
        }

        # Dashboard, REST API and SSE streams (long-lived, must not buffer).
        location / {
            set $backend http://viz-backend:8080;
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
        }
    }
}
